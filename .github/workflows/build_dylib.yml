name: Build FakeOwnLicense

on:
  push:
    paths:
      - 'FakeOwnLicense.m'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get iOS SDK path
        id: sdk
        run: echo "sdk=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_OUTPUT

      - name: Build arm64 dylib
        run: |
          clang \
            -arch arm64 \
            -isysroot "${{ steps.sdk.outputs.sdk }}" \
            -shared -fPIC \
            -framework Foundation \
            -framework UIKit \
            -install_name @rpath/OwnLicense.framework/OwnLicense \
            -Wno-objc-property-no-attribute \
            -Wno-unused-parameter \
            -O2 \
            -o FakeOwnLicense.dylib \
            FakeOwnLicense.m

      - name: Verify output
        run: |
          file FakeOwnLicense.dylib
          nm -D FakeOwnLicense.dylib | grep "_penny_module_fingerprint"
          nm -D FakeOwnLicense.dylib | grep "_ol_session_allowed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FakeOwnLicense-dylib
          path: FakeOwnLicense.dylib
          retention-days: 7
